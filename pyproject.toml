[project]
name = "netproof"
version = "0.1.0"
description = "Netproof MVP"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-multipart",
    "sse-starlette",
    "anthropic",
    "fpdf2>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.optional-dependencies]
gemini = ["google-genai"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Package lives in backend/netproof; installs as "netproof" (editable in dev).
packages = ["backend/netproof"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
