# Render Blueprint: one free Docker web service (FastAPI + ngspice, serves web/).
# Render injects PORT at runtime; the Dockerfile CMD binds to it.
services:
  - type: web
    name: netproof
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Set in the Render dashboard on first deploy (never committed).
      # LLM_PROVIDER: "anthropic" or "gemini"; fill in the matching key.
      - key: LLM_PROVIDER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
